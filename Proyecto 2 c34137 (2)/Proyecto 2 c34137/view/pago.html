<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pagos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Sistema Hotelero</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="hotel.html">Hoteles</a></li>
                    <li class="nav-item"><a class="nav-link" href="sede.html">Sedes</a></li>
                    <li class="nav-item"><a class="nav-link" href="habitacion.html">Habitaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="cliente.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservacion.html">Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link active" href="pago.html">Pagos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="alertaPagina"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Lista de Pagos</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFormulario" onclick="prepararFormularioAgregar()">
                + Crear Pago
            </button>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-sm-4">
                <select class="form-select" id="filtroReservacion">
                    <option value="">Todas las reservaciones</option>
                </select>
            </div>
            <div class="col-sm-3">
                <select class="form-select" id="filtroId">
                    <option value="">Todos</option>
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">Limpiar</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Monto</th>
                                <th>Fecha Pago</th>
                                <th>Método</th>
                                <th>Detalle</th>
                                <th>Estado</th>
                                <th>ID Reservación</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <tr><td colspan="8" class="text-center py-3">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalFormulario" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="tituloModal">Crear Pago</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formulario" novalidate>
                        <input type="hidden" id="pagoId">

                        <div class="mb-3">
                            <label for="id_reservacion" class="form-label">Reservación *</label>
                            <select class="form-select" id="id_reservacion" name="id_reservacion">
                                <option value="">-- Seleccione --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="monto" class="form-label">Monto ($) *</label>
                            <input type="number" class="form-control" id="monto" name="monto" placeholder="Ej: 150.00" min="0" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="metodo" class="form-label">Método de Pago *</label>
                            <select class="form-select" id="metodo" name="metodo">
                                <option value="">-- Seleccione --</option>
                                <option value="Tarjeta Crédito">Tarjeta Crédito</option>
                                <option value="Tarjeta Débito">Tarjeta Débito</option>
                                <option value="Efectivo">Efectivo</option>
                                <option value="Transferencia">Transferencia</option>
                                <option value="Cheque">Cheque</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="detalle" class="form-label">Detalle</label>
                            <input type="text" class="form-control" id="detalle" name="detalle" placeholder="Ej: Pago inicial">
                        </div>
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado *</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">-- Seleccione --</option>
                                <option value="Pendiente">Pendiente</option>
                                <option value="Pagado">Pagado</option>
                                <option value="Rechazado">Rechazado</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="fecha_pago" class="form-label">Fecha del Pago *</label>
                            <input type="datetime-local" class="form-control" id="fecha_pago" name="fecha_pago">
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario *</label>
                            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ej: Admin">
                        </div>

                        <div id="alertaFormulario"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit" form="formulario">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../controllers/pagoController.js"></script>
</body>
</html>
