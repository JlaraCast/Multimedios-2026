<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>Gestión de Cursos</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            table thead th, table tbody td {
                text-align: left;
                vertical-align: middle;
            }
            table th:nth-child(1), table td:nth-child(1) { width: 8%; }
            table th:nth-child(2), table td:nth-child(2) { width: 15%; }
            table th:nth-child(3), table td:nth-child(3) { width: 35%; word-wrap: break-word; white-space: normal; }
            table th:nth-child(4), table td:nth-child(4) { width: 12%; }
            table th:nth-child(5), table td:nth-child(5) { width: 15%; }
            table th:nth-child(6), table td:nth-child(6) { width: 15%; }
        </style>
    </head>

    <body class="bg-light">
        <header class="bg-primary text-white py-3 mb-4">
            <div class="container">
                <h1 class="mb-0">Gestión de Cursos</h1>
            </div>
        </header>

        <main>
            <div class="container-fluid">
                <!-- BOTÓN PARA AGREGAR NUEVO CURSO -->
                <div class="row mb-4 mt-4">
                    <div class="col-12">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFormulario" onclick="prepararFormularioAgregar()">
                            + Agregar Nuevo Curso
                        </button>
                    </div>
                </div>

                <!-- SECCIÓN DE TABLA -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0">Lista de Cursos</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Nombre</th>
                                                <th>Descripción</th>
                                                <th>Horas</th>
                                                <th>Instructor</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tablaCurso">
                                            <tr>
                                                <td colspan="6" class="text-center text-muted py-3">
                                                    Cargando cursos...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- MODAL DEL FORMULARIO -->
        <div class="modal fade" id="modalFormulario" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="tituloCurso">Agregar Nuevo Curso</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formulario" novalidate>
                            <input type="hidden" id="cursoId" />
                            
                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Curso *</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="nombre"
                                    id="nombre"
                                    placeholder="Nombre del curso"
                                    required
                                />
                            </div>

                            <div class="mb-3">
                                <label for="usuario" class="form-label">Instructor *</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="usuario"
                                    id="usuario"
                                    placeholder="Nombre del instructor"
                                    required
                                />
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción *</label>
                                <textarea
                                    class="form-control"
                                    name="descripcion"
                                    id="descripcion"
                                    rows="3"
                                    placeholder="Descripción del curso"
                                    required
                                ></textarea>
                            </div>

                            <div class="mb-3">
                                <label for="tiempo" class="form-label">Duración (horas) *</label>
                                <input
                                    type="number"
                                    class="form-control"
                                    name="tiempo"
                                    id="tiempo"
                                    placeholder="Número de horas"
                                    min="1"
                                    required
                                />
                            </div>

                            <div id="alertaFormulario"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelarModal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit" form="formulario">
                            Agregar Curso
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-white text-center py-3 mt-5">
            <p class="mb-0">&copy; 2026 Sistema de Gestión de Cursos</p>
        </footer>

        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script type="module" src="../controllers/cursoController.js"></script>
    </body>
</html>
