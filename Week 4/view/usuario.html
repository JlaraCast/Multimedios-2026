<!doctype html>
<html lang="es" data-bs-theme="light">
    <head>
        <title>Gestión de Usuarios</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <style>
            table thead th, table tbody td {
                text-align: left;
                vertical-align: middle;
            }
            table th:nth-child(1), table td:nth-child(1) { width: 10%; }
            table th:nth-child(2), table td:nth-child(2) { width: 25%; }
            table th:nth-child(3), table td:nth-child(3) { width: 40%; word-wrap: break-word; white-space: normal; }
            table th:nth-child(4), table td:nth-child(4) { width: 25%; }
        </style>
    </head>

    <body class="bg-light">
        <header class="bg-primary text-white py-3 mb-4">
            <div class="container">
                <h1 class="mb-0">Gestión de Usuarios</h1>
            </div>
        </header>

        <main>
            <div class="container-fluid">
                <div class="row mb-4 mt-4">
                    <div class="col-12">
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFormulario" onclick="prepararFormularioAgregar()">
                            + Agregar Nuevo Usuario
                        </button>
                    </div>
                </div>

                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header bg-primary text-white">
                                <h5 class="mb-0">Lista de Usuarios</h5>
                            </div>
                            <div class="card-body">
                                <div class="table-responsive">
                                    <table class="table table-striped">
                                        <thead>
                                            <tr>
                                                <th>ID</th>
                                                <th>Nombre</th>
                                                <th>Email</th>
                                                <th>Acciones</th>
                                            </tr>
                                        </thead>
                                        <tbody id="tablaUsuario">
                                            <tr>
                                                <td colspan="4" class="text-center text-muted py-3">
                                                    Cargando usuarios...
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- MODAL DEL FORMULARIO -->
        <div class="modal fade" id="modalFormulario" tabindex="-1">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <div class="modal-header bg-primary text-white">
                        <h5 class="modal-title" id="tituloUsuario">Agregar Nuevo Usuario</h5>
                        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formulario" novalidate>
                            <input type="hidden" id="usuarioId" />
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Nombre *</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    name="name"
                                    id="name"
                                    placeholder="Nombre del usuario"
                                    required
                                />
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email *</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    name="email"
                                    id="email"
                                    placeholder="correo@ejemplo.com"
                                    required
                                />
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña *</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    name="password"
                                    id="password"
                                    placeholder="Mínimo 6 caracteres"
                                    minlength="6"
                                    required
                                />
                            </div>

                            <div id="alertaFormulario"></div>
                        </form>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelarModal">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnSubmit" form="formulario">
                            Agregar Usuario
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <footer class="bg-dark text-white text-center py-3 mt-5">
            <p class="mb-0">&copy; 2026 Sistema de Gestión de Usuarios</p>
        </footer>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>

        <script type="module" src="../controllers/usuarioController.js"></script>
    </body>
</html>
