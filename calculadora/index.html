<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculadora</title>
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 bg-dark">

  <div class="calculator shadow-lg rounded-4 overflow-hidden">

    <!-- Pantalla -->
    <div class="display p-3 bg-white text-end">
      <div id="expression" class="text-secondary small mb-1 expression-text">&nbsp;</div>
      <input
        id="screen"
        type="text"
        class="form-control form-control-lg bg-white border-0 text-dark text-end fs-2 fw-bold p-0"
        readonly
        value="0"
        aria-label="Pantalla de la calculadora"
      />
    </div>

    <!-- Botones -->
    <div class="buttons p-3 bg-secondary bg-opacity-10">

      <!-- Fila 1 -->
      <div class="row g-2 mb-2">
        <div class="col-9">
          <button class="btn btn-warning w-100 fs-5 fw-semibold calc-btn" onclick="clearAll()">C</button>
        </div>
        <div class="col-3">
          <button class="btn btn-primary w-100 fs-5 fw-semibold calc-btn" onclick="chooseOperator('/')">÷</button>
        </div>
      </div>

      <!-- Fila 2 -->
      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('7')">7</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('8')">8</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('9')">9</button>
        </div>
        <div class="col-3">
          <button class="btn btn-primary w-100 fs-5 calc-btn" onclick="chooseOperator('*')">×</button>
        </div>
      </div>

      <!-- Fila 3 -->
      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('4')">4</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('5')">5</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('6')">6</button>
        </div>
        <div class="col-3">
          <button class="btn btn-primary w-100 fs-5 calc-btn" onclick="chooseOperator('-')">−</button>
        </div>
      </div>

      <!-- Fila 4 -->
      <div class="row g-2 mb-2">
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('1')">1</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('2')">2</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('3')">3</button>
        </div>
        <div class="col-3">
          <button class="btn btn-primary w-100 fs-5 calc-btn" onclick="chooseOperator('+')">+</button>
        </div>
      </div>

      <!-- Fila 5 -->
      <div class="row g-2">
        <div class="col-6">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendNumber('0')">0</button>
        </div>
        <div class="col-3">
          <button class="btn btn-outline-light w-100 fs-5 calc-btn" onclick="appendDecimal()">.</button>
        </div>
        <div class="col-3">
          <button id="btn-equal" class="btn btn-success w-100 fs-5 fw-bold calc-btn" onclick="calculate()">=</button>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
