<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Habitaciones</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="../index.html">Sistema Hotelero</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="hotel.html">Hoteles</a></li>
                    <li class="nav-item"><a class="nav-link" href="sede.html">Sedes</a></li>
                    <li class="nav-item"><a class="nav-link active" href="habitacion.html">Habitaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="cliente.html">Clientes</a></li>
                    <li class="nav-item"><a class="nav-link" href="reservacion.html">Reservaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="pago.html">Pagos</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div id="alertaPagina"></div>

        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h4 mb-0">Lista de Habitaciones</h2>
            <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalFormulario" onclick="prepararFormularioAgregar()">
                + Crear Habitación
            </button>
        </div>

        <div class="row g-2 mb-3">
            <div class="col-sm-4">
                <select class="form-select" id="filtroSede">
                    <option value="">Todas las sedes</option>
                </select>
            </div>
            <div class="col-sm-3">
                <select class="form-select" id="filtroId">
                    <option value="">Todas</option>
                </select>
            </div>
            <div class="col-auto">
                <button class="btn btn-outline-secondary" id="btnLimpiarFiltros">Limpiar</button>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>#</th>
                                <th>Número</th>
                                <th>Tipo</th>
                                <th>Descripción</th>
                                <th>Precio</th>
                                <th>Capacidad</th>
                                <th>Estado</th>
                                <th>ID Sede</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla">
                            <tr><td colspan="9" class="text-center py-3">Cargando...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal -->
    <div class="modal fade" id="modalFormulario" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title" id="tituloModal">Crear Habitación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formulario" novalidate>
                        <input type="hidden" id="habitacionId">

                        <div class="mb-3">
                            <label for="id_sede" class="form-label">Sede *</label>
                            <select class="form-select" id="id_sede" name="id_sede">
                                <option value="">-- Seleccione --</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="numero" class="form-label">Número *</label>
                            <input type="text" class="form-control" id="numero" name="numero" placeholder="Ej: 101">
                        </div>
                        <div class="mb-3">
                            <label for="tipo" class="form-label">Tipo *</label>
                            <select class="form-select" id="tipo" name="tipo">
                                <option value="">-- Seleccione --</option>
                                <option value="Simple">Simple</option>
                                <option value="Doble">Doble</option>
                                <option value="Suite">Suite</option>
                                <option value="Presidencial">Presidencial</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="descripcion" class="form-label">Descripción</label>
                            <input type="text" class="form-control" id="descripcion" name="descripcion" placeholder="Ej: Vista al mar, cama king">
                        </div>
                        <div class="mb-3">
                            <label for="precio" class="form-label">Precio por Noche ($) *</label>
                            <input type="number" class="form-control" id="precio" name="precio" placeholder="Ej: 75.50" min="0" step="0.01">
                        </div>
                        <div class="mb-3">
                            <label for="capacidad" class="form-label">Capacidad (personas)</label>
                            <input type="number" class="form-control" id="capacidad" name="capacidad" placeholder="Ej: 2" min="1">
                        </div>
                        <div class="mb-3">
                            <label for="estado" class="form-label">Estado *</label>
                            <select class="form-select" id="estado" name="estado">
                                <option value="">-- Seleccione --</option>
                                <option value="Disponible">Disponible</option>
                                <option value="Ocupada">Ocupada</option>
                                <option value="Mantenimiento">Mantenimiento</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="usuario" class="form-label">Usuario *</label>
                            <input type="text" class="form-control" id="usuario" name="usuario" placeholder="Ej: Admin">
                        </div>

                        <div id="alertaFormulario"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btnCancelarModal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btnSubmit" form="formulario">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="../controllers/habitacionController.js"></script>
</body>
</html>
